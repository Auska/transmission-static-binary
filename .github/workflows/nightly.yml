name: Build static Transmission binaries (nightly)

# Run daily to build a nightly binary when transmission moved.
on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC every day
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even when upstream commits are unchanged'
        required: false
        default: false
        type: boolean
      transmission_sha:
        description: 'Transmission commit SHA to build, e.g. 2f3e4d5 / Empty = latest.'
        required: false
        default: ''
        type: string

jobs:
  # --------------------------------------------------------------------------
  # Detect whether transmission/transmission has new commits since the last
  # nightly build that produced binaries.
  # --------------------------------------------------------------------------
  check-version:
    name: Check for New Upstream Commits
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    outputs:
      transmission_sha:       ${{ steps.upstream.outputs.transmission_sha }}
      transmission_short_sha: ${{ steps.upstream.outputs.transmission_short_sha }}
      build_id:               ${{ steps.upstream.outputs.build_id }}
      should_build:           ${{ steps.check.outputs.should_build }}

    steps:
      - name: Fetch latest upstream commit
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TRANSMISSION_SHA: ${{ inputs.transmission_sha }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_TRANSMISSION_SHA" ]]; then
            echo "transmission_sha=$INPUT_TRANSMISSION_SHA" >> "$GITHUB_OUTPUT"
            echo "transmission_short_sha=$(printf '%s' "$INPUT_TRANSMISSION_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
            echo "Using user-provided transmission SHA: $INPUT_TRANSMISSION_SHA"
          else
            branch=$(gh api "repos/transmission/transmission" --jq .default_branch)
            sha=$(gh api "repos/transmission/transmission/commits/${branch}" --jq .sha)
            short_sha=$(printf '%s' "$sha" | cut -c1-7)
            echo "transmission_branch=${branch}" >> "$GITHUB_OUTPUT"
            echo "transmission_sha=${sha}" >> "$GITHUB_OUTPUT"
            echo "transmission_short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
            echo "transmission: ${branch} @ ${sha}"
          fi

          transmission_sha=$(awk -F= '$1 == "transmission_sha" { print $2 }' "$GITHUB_OUTPUT")
          transmission_short_sha=$(printf '%s' "$transmission_sha" | cut -c1-7)
          echo "build_id=${transmission_short_sha}" >> "$GITHUB_OUTPUT"

      - name: Check last nightly build
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
          CURRENT_TRANSMISSION_SHA: ${{ steps.upstream.outputs.transmission_sha }}
        run: |
          set -euo pipefail

          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "force_rebuild=true; scheduling nightly build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p previous
          previous_run_id=""

          while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            rm -rf previous
            mkdir -p previous

            if gh run download "$run_id" \
                 --repo "${{ github.repository }}" \
                 --name nightly-upstream-commits \
                 --dir previous >/dev/null 2>&1; then
              previous_run_id="$run_id"
              break
            fi
          done < <(
            gh run list \
              --repo "${{ github.repository }}" \
              --workflow nightly.yml \
              --status success \
              --limit 30 \
              --json databaseId \
              --jq '.[].databaseId'
          )

          if [[ -z "$previous_run_id" || ! -f previous/UPSTREAM_COMMITS ]]; then
            echo "No previous nightly build metadata found. Scheduling build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_transmission_sha=$(awk -F= '$1 == "transmission_sha" { print $2 }' previous/UPSTREAM_COMMITS)

          echo "Last nightly build run: ${previous_run_id}"
          echo "Previous transmission:  ${previous_transmission_sha}"
          echo "Current transmission:   ${CURRENT_TRANSMISSION_SHA}"

          if [[ "$previous_transmission_sha" == "$CURRENT_TRANSMISSION_SHA" ]]; then
            echo "No new upstream commits since the last nightly build. Skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream commit detected. Scheduling build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------------------------------
  # Build the static binary for each target architecture.
  # Both amd64 and arm64 jobs run in parallel; arm64 uses QEMU emulation.
  # --------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.arch }})
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
    outputs:
      alpine_version: ${{ steps.alpine.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read Alpine version number from alpine:latest
        id: alpine
        run: |
          ALPINE_VERSION=$(docker run --rm alpine:latest cat /etc/alpine-release)
          echo "version=$ALPINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Alpine version: $ALPINE_VERSION"

      - name: Build static transmission binary inside Alpine Linux container
        env:
          TRANSMISSION_SHA: ${{ needs.check-version.outputs.transmission_sha }}
          ARCH: ${{ matrix.arch }}
          SUFFIX: "-daily-${{ needs.check-version.outputs.build_id }}"
        run: |
          mkdir -p "${{ github.workspace }}/output"
          docker run --rm \
            --platform "linux/${{ matrix.arch }}" \
            -e "TRANSMISSION_SHA=${TRANSMISSION_SHA}" \
            -e "ARCH=${ARCH}" \
            -e "SUFFIX=${SUFFIX}" \
            -v "${{ github.workspace }}/build.sh:/build.sh:ro" \
            -v "${{ github.workspace }}/fetch-versions.sh:/fetch-versions.sh:ro" \
            -v "${{ github.workspace }}/download-sources.sh:/download-sources.sh:ro" \
            -v "${{ github.workspace }}/output:/output" \
            alpine:latest /bin/sh /build.sh

      - name: Verify binary is statically linked
        run: |
          tar -xJf "output/transmission-linux-${{ matrix.arch }}-daily-${{ needs.check-version.outputs.build_id }}.tar.xz" -C output
          FILE="output/transmission/bin/transmission-daemon"
          file "$FILE"
          if readelf -l "$FILE" | grep -q 'INTERP'; then
            echo "ERROR: Binary is NOT statically linked!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: transmission-linux-${{ matrix.arch }}-daily-${{ needs.check-version.outputs.build_id }}
          path: output/transmission-linux-${{ matrix.arch }}-daily-${{ needs.check-version.outputs.build_id }}.tar.xz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Publish the nightly binaries as Actions artifacts instead of GitHub releases.
  # --------------------------------------------------------------------------
  publish-artifacts:
    name: Publish Nightly Artifacts
    needs: [check-version, build]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: transmission-linux-*
          path: artifacts
          merge-multiple: true

      - name: Generate build metadata and checksums
        working-directory: artifacts
        env:
          ALPINE_VERSION: ${{ needs.build.outputs.alpine_version }}
          TRANSMISSION_SHA: ${{ needs.check-version.outputs.transmission_sha }}
          BUILD_ID: ${{ needs.check-version.outputs.build_id }}
        run: |
          find . -maxdepth 1 -type f -name 'transmission-linux-*' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

          {
            echo "transmission_sha=${TRANSMISSION_SHA}"
            echo "build_id=${BUILD_ID}"
            echo "alpine_version=${ALPINE_VERSION}"
            echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > UPSTREAM_COMMITS

      - name: Upload nightly binary bundle
        uses: actions/upload-artifact@v7
        with:
          name: transmission-nightly-${{ needs.check-version.outputs.build_id }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload nightly commit metadata
        uses: actions/upload-artifact@v7
        with:
          name: nightly-upstream-commits
          path: artifacts/UPSTREAM_COMMITS
          if-no-files-found: error
          retention-days: 90
